volumes:
  postgres_data:
  imposm_cache:
  imposm_expiry:
  imposm_diff:

services:
  db:
    image: postgis/postgis:17-3.4-alpine
    shm_size: 128mb
    ports:
      - 5460:5432

    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/dev-init.sql:/docker-entrypoint-initdb.d/90-dev-init.sql
      - ./schema/functions.sql:/docker-entrypoint-initdb.d/91-functions.sql
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U osm -d osm -c 'SELECT 1' -tA"]
      start_period: 30s
      start_interval: 1s
      interval: 2m
      timeout: 5s
      retries: 5
  imposm:
    build: imposm
    volumes:
      - imposm_cache:/imposm-cache
      - imposm_expiry:/imposm-expiry
      - imposm_diff:/imposm-diff
    command:
      - run
      - -expiretiles-dir
      - /imposm-expiry
      - -cachedir
      - /imposm-cache
      - -diffdir
      - /imposm-diff
      - -mapping
      - /mapping.json
      - -connection
      - "postgis://osm:osm@db/osm"
    depends_on:
      db:
        condition: service_healthy

  tegola:
    build: tegola
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DB_URI: "postgres://osm:osm@db:5432/osm"
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
